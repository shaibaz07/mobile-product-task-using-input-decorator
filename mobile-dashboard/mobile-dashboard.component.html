

<div class="row justify-content-center" *ngIf="mobilesArr.length > 0 ; else noMobiles">
    <div class="col-md-10 col-lg-8 mb-4" *ngFor="let mobile of mobilesArr">
        <app-mobile-card
        [mobielObj] ='mobile'
        ></app-mobile-card>
    </div>
</div>

<ng-template #noMobiles>
    <div class="alert alert-info">No mobile data available...</div>
</ng-template>
